services:
  postgres:
    image: postgis/postgis:18-3.6 # Postgres with the Postgis extension
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
  kafka:
    image: confluentinc/cp-kafka:7.7.8
    container_name: kafka
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
  spark:
    build:
      dockerfile: ./spark_stream_app/Dockerfile
    image: custom/spark:3.4.0
    pull_policy: never
    container_name: spark
    environment:
      SPARK_MODE: master
      RESET_CHECKPOINTS: ${RESET_CHECKPOINTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "8080:8080" # Spark UI
      - "7077:7077" # Spark master
    command:
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./spark_stream_app/src:/spark_stream_app/src
      - ./schemas:/spark_stream_app/schemas
      - ./spark_stream_app/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark_stream_app/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark_checkpoints:/checkpoints
  spark-worker:
    image: custom/spark:3.4.0
    pull_policy: never
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
    command:
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    depends_on:
      - spark
    volumes:
      - spark_work:${SPARK_WORKER_DIR}

volumes:
  postgres_data:
  kafka_data:
  spark_work:
  spark_checkpoints:
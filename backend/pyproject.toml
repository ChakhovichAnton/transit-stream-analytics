[project]
name = "backend"
version = "0.1.0"
description = "Backend of public transport app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.13.2",
    "fastapi>=0.135.2",
    "fastavro>=1.12.2",
    "osmnx>=2.1.0",
    "paho-mqtt>=2.1.0",
    "prometheus-client>=0.26.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
